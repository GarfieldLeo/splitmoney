[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitmoney"
version = "0.1.0"
description = "A trusted shared expense ledger"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schema.sql", "static/*.html", "static/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
